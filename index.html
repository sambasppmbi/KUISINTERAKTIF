<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Nutrition Goes to School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6EA;
    --paper:#FFFFFF;
    --ink:#2B3A26;
    --ink-soft:#5B6B54;
    --leaf:#5C9A4B;
    --leaf-dark:#3E7A30;
    --leaf-pale:#E4F1DC;
    --carrot:#E8873A;
    --carrot-pale:#FCE6D0;
    --tomato:#D6503F;
    --tomato-pale:#FBE0DC;
    --butter:#F2B93C;
    --line:#E7DFC9;
    --radius:20px;
    --shadow:0 10px 28px rgba(60,80,40,0.12);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 8% 12%, rgba(92,154,75,0.10), transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(232,135,58,0.12), transparent 42%),
      var(--cream);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    padding:32px 16px 56px;
    display:flex;
    justify-content:center;
  }
  .app{ width:100%; max-width:680px; }

  header.top{ text-align:center; margin-bottom:22px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Baloo 2', sans-serif;
    font-weight:600; font-size:13px; letter-spacing:.04em;
    color:var(--leaf-dark);
    background:var(--leaf-pale);
    border-radius:999px; padding:6px 14px;
    margin-bottom:14px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(28px, 6vw, 40px);
    line-height:1.08;
    margin:0 0 8px;
    color:var(--ink);
  }
  h1 span{ color:var(--leaf-dark); }
  .sub{
    color:var(--ink-soft);
    font-size:15.5px;
    font-weight:600;
    max-width:440px;
    margin:0 auto;
  }

  /* food progress trail */
  .trail{
    display:flex; justify-content:center; gap:6px;
    margin:26px 0 4px;
    flex-wrap:wrap;
  }
  .trail-item{
    width:30px; height:30px;
    border-radius:50%;
    background:var(--paper);
    border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    opacity:.55;
    transform:scale(.92);
    transition:all .25s ease;
  }
  .trail-item.current{
    border-color:var(--carrot);
    box-shadow:0 0 0 4px var(--carrot-pale);
    opacity:1; transform:scale(1.08);
  }
  .trail-item.done{
    border-color:var(--leaf);
    background:var(--leaf-pale);
    opacity:1; transform:scale(1);
  }
  .trail-caption{
    text-align:center; font-size:12.5px; font-weight:700;
    color:var(--ink-soft); margin-bottom:8px; letter-spacing:.02em;
  }

  /* card */
  .card{
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    padding:30px 26px 26px;
    margin-top:14px;
  }
  .q-count{
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:13px;
    color:var(--carrot);
    margin-bottom:10px;
    letter-spacing:.03em;
  }
  .q-text{
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:clamp(19px, 3.6vw, 22px);
    line-height:1.35;
    margin:0 0 22px;
    color:var(--ink);
  }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    display:flex; align-items:flex-start; gap:12px;
    text-align:left;
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:2px solid var(--line);
    background:#FEFDF9;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:15.5px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt:hover{ border-color:var(--leaf); background:var(--leaf-pale); }
  .opt:active{ transform:scale(.99); }
  .opt:focus-visible{ outline:3px solid var(--butter); outline-offset:2px; }
  .opt .letter{
    flex:0 0 auto;
    width:26px; height:26px; border-radius:50%;
    background:var(--leaf-pale); color:var(--leaf-dark);
    font-family:'Baloo 2', sans-serif; font-size:13px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .opt.selected{ border-color:var(--leaf); background:var(--leaf-pale); }
  .opt.selected .letter{ background:var(--leaf); color:#fff; }
  .opt.correct{ border-color:var(--leaf); background:var(--leaf-pale); }
  .opt.correct .letter{ background:var(--leaf); color:#fff; }
  .opt.wrong{ border-color:var(--tomato); background:var(--tomato-pale); }
  .opt.wrong .letter{ background:var(--tomato); color:#fff; }
  .opt[disabled]{ cursor:default; }
  .opt[disabled]:hover{ transform:none; }

  .feedback{
    margin-top:16px;
    font-size:14px;
    font-weight:700;
    padding:10px 14px;
    border-radius:12px;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.ok{ background:var(--leaf-pale); color:var(--leaf-dark); }
  .feedback.no{ background:var(--tomato-pale); color:var(--tomato); }

  .actions{
    display:flex; justify-content:flex-end;
    margin-top:22px;
  }
  .btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:15px;
    border:none; border-radius:999px;
    padding:12px 26px;
    cursor:pointer;
    background:var(--ink);
    color:#fff;
    transition:transform .12s ease, opacity .15s ease, background .15s ease;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
  .btn.primary{ background:var(--leaf); }
  .btn.primary:hover{ background:var(--leaf-dark); }
  .btn.ghost{
    background:transparent; color:var(--ink);
    border:2px solid var(--line);
  }
  .btn.ghost:hover{ border-color:var(--leaf); background:var(--leaf-pale); }

  /* results */
  .result{ display:none; }
  .result.show{ display:block; }
  .quiz-wrap.hide{ display:none; }

  .score-hero{
    text-align:center;
    padding:8px 4px 22px;
  }
  .plate{
    width:132px; height:132px; margin:0 auto 14px;
    border-radius:50%;
    background:conic-gradient(var(--leaf) calc(var(--pct,0)*1%), var(--line) 0);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .plate::before{
    content:"";
    position:absolute; inset:10px;
    border-radius:50%;
    background:var(--paper);
  }
  .plate .num{
    position:relative;
    font-family:'Baloo 2', sans-serif;
    font-weight:800; font-size:42px;
    color:var(--ink);
  }
  .score-tag{
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:21px;
    margin:0 0 6px;
  }
  .score-msg{
    color:var(--ink-soft); font-weight:600; font-size:14.5px;
    max-width:420px; margin:0 auto;
  }

  .review-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:16px;
    margin:26px 0 12px;
    color:var(--ink);
  }
  .review-item{
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    background:#FEFDF9;
  }
  .review-q{
    display:flex; gap:10px; align-items:flex-start;
    font-weight:700; font-size:14.5px; margin-bottom:8px;
  }
  .review-q .badge{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#fff; font-family:'Baloo 2',sans-serif;
  }
  .badge.ok{ background:var(--leaf); }
  .badge.no{ background:var(--tomato); }
  .review-a{ font-size:13.5px; color:var(--ink-soft); font-weight:600; line-height:1.5; }
  .review-a b{ color:var(--ink); }

  .result-actions{
    display:flex; justify-content:center; margin-top:22px;
  }

  footer{
    text-align:center; margin-top:28px;
    font-size:12.5px; color:var(--ink-soft); font-weight:600;
  }

  @media (max-width:420px){
    .card{ padding:22px 18px 20px; }
    .actions{ justify-content:stretch; }
    .btn{ width:100%; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <span class="eyebrow">🍽️ Nutrition Goes to School</span>
    <h1>Kuis <span>Gizi Seimbang</span> &amp; Hidup Sehat</h1>
    <p class="sub">Uji pemahamanmu tentang gizi seimbang, sarapan, dan kebiasaan sehat di sekolah lewat 10 pertanyaan seru berikut.</p>
  </header>

  <div class="quiz-wrap" id="quizWrap">
    <p class="trail-caption" id="trailCaption">Soal 1 dari 10</p>
    <div class="trail" id="trail"></div>

    <div class="card">
      <div class="q-count" id="qCount">SOAL 1</div>
      <p class="q-text" id="qText"></p>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn primary" id="nextBtn" disabled>Lanjut</button>
      </div>
    </div>
  </div>

  <div class="result" id="result">
    <div class="card">
      <div class="score-hero">
        <div class="plate" id="plate"><div class="num" id="plateNum">0</div></div>
        <p id="scoreDetail" style="margin-bottom: 14px; font-weight: 700; font-size: 14px; color: var(--ink-soft);"></p>
        <p class="score-tag" id="scoreTag"></p>
        <p class="score-msg" id="scoreMsg"></p>
      </div>

      <div class="review-title">Ringkasan Jawaban</div>
      <div id="reviewList"></div>

      <div class="result-actions">
        <button class="btn primary" id="retryBtn">🔄 Coba Lagi</button>
      </div>
    </div>
  </div>

  <footer>Nutrition Goes to School — belajar gizi seimbang jadi lebih menyenangkan 🥕🥦🍎</footer>
</div>

<script>
const QUESTIONS = [
  {
    q: "Apa yang dimaksud dengan gizi seimbang?",
    options: [
      "Menghindari semua jenis makanan berlemak",
      "Pola makan dengan beragam zat gizi sesuai kebutuhan tubuh",
      "Hanya mengonsumsi makanan yang mengandung protein",
      "Mengonsumsi makanan dalam jumlah sebanyak-banyaknya"
    ],
    correct: 1,
    icon: "⚖️"
  },
  {
    q: "Mengapa sarapan penting bagi pelajar sebelum memulai kegiatan di sekolah?",
    options: [
      "Membantu menyediakan energi untuk memulai aktivitas",
      "Membuat tubuh tidak memerlukan air sepanjang hari",
      "Menjamin seseorang tidak akan pernah merasa lelah",
      "Menggantikan semua waktu makan lainnya"
    ],
    correct: 0,
    icon: "🍳"
  },
  {
    q: "Manakah pilihan berikut yang paling baik untuk membantu memenuhi kebutuhan cairan tubuh sehari-hari?",
    options: [
      "Air putih",
      "Minuman sangat manis dalam jumlah banyak",
      "Minuman bersoda setiap saat",
      "Tidak minum selama berada di sekolah"
    ],
    correct: 0,
    icon: "💧"
  },
  {
    q: "Mengapa buah dan sayur penting dalam pola makan sehari-hari?",
    options: [
      "Menjadi sumber berbagai vitamin, mineral, dan serat",
      "Menjadi satu-satunya makanan yang diperlukan tubuh",
      "Membuat tubuh tidak membutuhkan air",
      "Menggantikan seluruh kebutuhan protein tubuh"
    ],
    correct: 0,
    icon: "🥦"
  },
  {
    q: "Saat membeli jajanan di sekolah, pilihan yang lebih baik adalah makanan yang...",
    options: [
      "Bersih, aman, dan memiliki kandungan gizi yang baik",
      "Dipilih hanya karena warnanya paling mencolok",
      "Selalu paling murah tanpa memperhatikan kebersihan",
      "Dibiarkan terbuka dan mudah terkena debu"
    ],
    correct: 0,
    icon: "🍱"
  },
  {
    q: "Manakah contoh kebiasaan makan yang mendukung pola hidup sehat?",
    options: [
      "Memilih makanan hanya berdasarkan tren di media sosial",
      "Hanya makan satu jenis makanan setiap hari",
      "Mengonsumsi makanan yang beragam dan sesuai kebutuhan",
      "Sering melewatkan makan tanpa alasan"
    ],
    correct: 2,
    icon: "🍽️"
  },
  {
    q: "Zat gizi yang berperan utama sebagai sumber energi bagi tubuh adalah...",
    options: [
      "Mineral",
      "Karbohidrat",
      "Vitamin",
      "Air"
    ],
    correct: 1,
    icon: "🍚"
  },
  {
    q: "Apa manfaat membiasakan minum air putih saat beraktivitas di sekolah?",
    options: [
      "Membantu menjaga kecukupan cairan tubuh",
      "Menggantikan kebutuhan semua makanan",
      "Menjadi sumber utama protein",
      "Membuat tubuh tidak membutuhkan istirahat"
    ],
    correct: 0,
    icon: "🚰"
  },
  {
    q: "Sebelum makan, kebiasaan sederhana yang penting untuk menjaga kebersihan adalah...",
    options: [
      "Memegang makanan setelah menyentuh berbagai benda tanpa membersihkan tangan",
      "Mencuci tangan dengan benar",
      "Mengabaikan kebersihan tempat makan",
      "Membiarkan makanan terkena debu"
    ],
    correct: 1,
    icon: "🧼"
  },
  {
    q: "Tujuan utama kegiatan Nutrition Goes to School adalah...",
    options: [
      "Membuat siswa memilih makanan hanya berdasarkan rasa",
      "Mengajarkan siswa untuk hanya mengonsumsi satu jenis makanan",
      "Mendorong siswa untuk melewatkan sarapan setiap hari",
      "Meningkatkan pengetahuan dan kesadaran tentang pentingnya gizi serta pola hidup sehat"
    ],
    correct: 3,
    icon: "🎓"
  }
];

const LETTERS = ["A","B","C","D"];
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let locked = false;

const trailEl = document.getElementById("trail");
const trailCaption = document.getElementById("trailCaption");
const qCount = document.getElementById("qCount");
const qText = document.getElementById("qText");
const optionsEl = document.getElementById("options");
const feedbackEl = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");
const quizWrap = document.getElementById("quizWrap");
const resultEl = document.getElementById("result");

function buildTrail(){
  trailEl.innerHTML = "";
  QUESTIONS.forEach((item, i) => {
    const d = document.createElement("div");
    d.className = "trail-item";
    d.textContent = item.icon;
    trailEl.appendChild(d);
  });
}

function updateTrail(){
  const items = trailEl.querySelectorAll(".trail-item");
  items.forEach((el, i) => {
    el.classList.remove("current","done");
    if (answers[i] !== null) el.classList.add("done");
    if (i === current) el.classList.add("current");
  });
  trailCaption.textContent = `Soal ${current+1} dari ${QUESTIONS.length}`;
}

function renderQuestion(){
  locked = answers[current] !== null;
  const item = QUESTIONS[current];
  qCount.textContent = `SOAL ${current+1}`;
  qText.textContent = item.q;
  optionsEl.innerHTML = "";
  feedbackEl.className = "feedback";
  feedbackEl.textContent = "";

  item.options.forEach((optText, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${LETTERS[i]}</span><span>${optText}</span>`;
    btn.addEventListener("click", () => selectOption(i));
    optionsEl.appendChild(btn);
  });

  if (locked){
    showAnswerState();
  }

  nextBtn.disabled = !locked;
  nextBtn.textContent = current === QUESTIONS.length - 1 ? "Lihat Hasil" : "Lanjut";
  updateTrail();
}

function selectOption(i){
  if (locked) return;
  locked = true;
  answers[current] = i;
  showAnswerState();
  nextBtn.disabled = false;
  updateTrail();
}

function showAnswerState(){
  const item = QUESTIONS[current];
  const chosen = answers[current];
  const opts = optionsEl.querySelectorAll(".opt");
  opts.forEach((btn, i) => {
    btn.disabled = true;
    if (i === item.correct) btn.classList.add("correct");
    if (i === chosen && chosen !== item.correct) btn.classList.add("wrong");
    if (i === chosen) btn.classList.add("selected");
  });
  feedbackEl.classList.add("show");
  if (chosen === item.correct){
    feedbackEl.classList.add("ok");
    feedbackEl.textContent = "✅ Benar! Jawaban kamu tepat.";
  } else {
    feedbackEl.classList.add("no");
    feedbackEl.textContent = `❌ Belum tepat. Jawaban yang benar: ${LETTERS[item.correct]}. ${item.options[item.correct]}`;
  }
}

nextBtn.addEventListener("click", () => {
  if (current < QUESTIONS.length - 1){
    current++;
    renderQuestion();
  } else {
    showResult();
  }
});

function showResult(){
  quizWrap.classList.add("hide");
  resultEl.classList.add("show");

  // Hitung jumlah jawaban benar dan salah
  const correctCount = answers.reduce((acc, a, i) => acc + (a === QUESTIONS[i].correct ? 1 : 0), 0);
  const wrongCount = QUESTIONS.length - correctCount;
  
  // Hitung skor akhir (skala 100)
  const finalScore = Math.round((correctCount / QUESTIONS.length) * 100);

  // Tampilkan skor dan persentase melingkar
  document.getElementById("plate").style.setProperty("--pct", finalScore);
  document.getElementById("plateNum").innerHTML = `${finalScore}`;
  
  // Tampilkan detail jumlah Benar dan Salah
  document.getElementById("scoreDetail").innerHTML = `<span style="color: var(--leaf-dark);">Benar: ${correctCount}</span> | <span style="color: var(--tomato);">Salah: ${wrongCount}</span>`;

  // Tentukan pesan berdasarkan skor skala 100
  let tag, msg;
  if (finalScore >= 90){
    tag = "🌟 Ahli Gizi Cilik!";
    msg = "Luar biasa! Pemahamanmu tentang gizi seimbang dan pola hidup sehat sudah sangat baik.";
  } else if (finalScore >= 70){
    tag = "🥦 Sudah Cukup Paham!";
    msg = "Bagus! Kamu sudah memahami sebagian besar konsep gizi seimbang. Terus tingkatkan lagi, ya!";
  } else if (finalScore >= 50){
    tag = "🍎 Perlu Sedikit Belajar Lagi";
    msg = "Lumayan! Coba pelajari kembali materi tentang gizi seimbang dan kebiasaan hidup sehat di sekolah.";
  } else {
    tag = "🥕 Ayo Belajar Lagi!";
    msg = "Jangan menyerah! Yuk pelajari lagi materi Nutrition Goes to School lalu coba kuis ini sekali lagi.";
  }
  
  document.getElementById("scoreTag").textContent = tag;
  document.getElementById("scoreMsg").textContent = msg;

  const reviewList = document.getElementById("reviewList");
  reviewList.innerHTML = "";
  QUESTIONS.forEach((item, i) => {
    const isCorrect = answers[i] === item.correct;
    const div = document.createElement("div");
    div.className = "review-item";
    div.innerHTML = `
      <div class="review-q">
        <span class="badge ${isCorrect ? 'ok' : 'no'}">${isCorrect ? '✓' : '✕'}</span>
        <span>${i+1}. ${item.q}</span>
      </div>
      <div class="review-a">
        Jawabanmu: <b>${answers[i] !== null ? LETTERS[answers[i]] + '. ' + item.options[answers[i]] : '(tidak dijawab)'}</b>
        ${isCorrect ? '' : `<br>Jawaban benar: <b>${LETTERS[item.correct]}. ${item.options[item.correct]}</b>`}
      </div>
    `;
    reviewList.appendChild(div);
  });
}

document.getElementById("retryBtn").addEventListener("click", () => {
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  resultEl.classList.remove("show");
  quizWrap.classList.remove("hide");
  renderQuestion();
});

buildTrail();
renderQuestion();
</script>
</body>
</html>
