<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis NGTS - Nutrition Goes to School</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eaf7ef, #f7fbf8);
        color: #183b2a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .container {
        width: 100%;
        max-width: 720px;
    }
    .card {
        background: #fff;
        border-radius: 22px;
        box-shadow: 0 12px 35px rgba(0,0,0,.10);
        overflow: hidden;
    }
    .header {
        background: linear-gradient(135deg, #167a45, #25a65d);
        color: white;
        padding: 28px 30px;
        text-align: center;
    }
    .school-title {
        margin: 0;
        font-size: 29px;
        font-weight: 800;
        letter-spacing: 1px;
    }
    .school-name {
        margin-top: 7px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: .5px;
    }
    .ngts-title {
        margin-top: 8px;
        font-size: 14px;
        opacity: .92;
    }
    .content { padding: 30px; }
    .start-screen, .quiz-screen, .result-screen { text-align: center; }
    .start-icon {
        font-size: 58px;
        margin-bottom: 10px;
    }
    .start-screen h2, .result-screen h2 { margin: 10px 0; }
    .start-screen p { line-height: 1.6; color: #5d6d64; }
    .btn {
        border: 0;
        border-radius: 12px;
        padding: 13px 24px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: .2s;
    }
    .btn-primary {
        background: #16834a;
        color: white;
    }
    .btn-primary:hover { background: #116b3c; transform: translateY(-1px); }
    .btn-secondary {
        background: #edf5f0;
        color: #17683e;
        margin-left: 8px;
    }
    .progress-wrap { margin-bottom: 22px; text-align: left; }
    .progress-info {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: #627269;
        margin-bottom: 8px;
    }
    .progress {
        height: 9px;
        background: #e7eee9;
        border-radius: 20px;
        overflow: hidden;
    }
    .progress-bar {
        height: 100%;
        width: 10%;
        background: #20a45b;
        transition: width .3s;
    }
    .question {
        font-size: 22px;
        line-height: 1.4;
        font-weight: bold;
        text-align: left;
        margin-bottom: 22px;
    }
    .options {
        display: grid;
        gap: 12px;
        text-align: left;
    }
    .option {
        border: 2px solid #e0e9e3;
        background: #fff;
        padding: 15px;
        border-radius: 13px;
        cursor: pointer;
        font-size: 16px;
        transition: .2s;
    }
    .option:hover {
        border-color: #5fc78b;
        background: #f5fcf7;
    }
    .option.selected {
        border-color: #16834a;
        background: #e8f7ee;
    }
    .option input { display: none; }
    .option-letter {
        display: inline-flex;
        width: 30px;
        height: 30px;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #edf4ef;
        color: #17683e;
        font-weight: bold;
        margin-right: 10px;
    }
    .option.selected .option-letter {
        background: #16834a;
        color: white;
    }
    .action {
        margin-top: 25px;
        display: flex;
        justify-content: flex-end;
    }
    .score {
        font-size: 64px;
        font-weight: bold;
        color: #16834a;
        margin: 15px 0;
    }
    .result-message {
        font-size: 18px;
        color: #53665b;
        line-height: 1.5;
        margin-bottom: 25px;
    }
    .details {
        background: #f3f8f4;
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 22px;
    }
    .hidden { display: none; }
    .note {
        font-size: 13px;
        color: #6d7c73;
        margin-top: 18px;
        text-align: center;
    }
    @media (max-width: 600px) {
        body { padding: 10px; }
        .content { padding: 22px; }
        .header { padding: 23px 18px; }
        .school-title { font-size: 24px; }
        .school-name { font-size: 16px; }
        .ngts-title { font-size: 13px; }
        .question { font-size: 19px; }
        .score { font-size: 52px; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">
            <div class="school-title">KUIS INTERAKTIF</div>
            <div class="school-name">MA M. BASIUNI IMRAN SAMBAS</div>
            <div class="ngts-title">NGTS — Nutrition Goes to School</div>
        </div>

        <div class="content">

            <!-- HALAMAN MULAI -->
            <div id="startScreen" class="start-screen">
                <div class="start-icon">🥗</div>
                <h2>Siap Mengikuti Kuis?</h2>
                <p>
                    Jawablah 10 pertanyaan seputar gizi, makanan sehat,
                    kebersihan, dan kebiasaan hidup sehat di sekolah.
                </p>
                <button class="btn btn-primary" onclick="startQuiz()">Mulai Kuis</button>
                <div class="note">Setiap jawaban benar bernilai 10 poin.</div>
            </div>

            <!-- HALAMAN KUIS -->
            <div id="quizScreen" class="quiz-screen hidden">
                <div class="progress-wrap">
                    <div class="progress-info">
                        <span id="questionNumber">Soal 1 dari 10</span>
                        <span id="scoreInfo">Benar: 0</span>
                    </div>
                    <div class="progress">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                </div>

                <div id="questionText" class="question"></div>
                <div id="options" class="options"></div>

                <div class="action">
                    <button id="nextBtn" class="btn btn-primary" onclick="nextQuestion()" disabled>
                        Berikutnya
                    </button>
                </div>
            </div>

            <!-- HALAMAN HASIL -->
            <div id="resultScreen" class="result-screen hidden">
                <div class="start-icon">🏆</div>
                <h2>Kuis Selesai!</h2>
                <div id="score" class="score">0</div>
                <div id="resultMessage" class="result-message"></div>
                <div id="details" class="details"></div>
                <button class="btn btn-primary" onclick="restartQuiz()">Ulangi Kuis</button>
            </div>

        </div>
    </div>
</div>

<script>
/*
===========================================================
EDIT SOAL DI BAGIAN INI
===========================================================
- question = pertanyaan
- options = pilihan A, B, C, D
- answer = jawaban benar: "A", "B", "C", atau "D"
===========================================================
*/

const questions = [
    {
        question: "Apa kepanjangan dari NGTS?",
        options: {
            A: "Nutrition Goes to School",
            B: "Nutrition Guide for Students",
            C: "Nutritional Growth for School",
            D: "Nutrition Good Student"
        },
        answer: "A"
    },
    {
        question: "Manakah contoh sarapan yang paling mendukung pola makan beragam?",
        options: {
            A: "Keripik dan minuman manis",
            B: "Nasi, telur, sayur, buah, dan air putih",
            C: "Permen dan minuman bersoda",
            D: "Gorengan dan minuman manis"
        },
        answer: "B"
    },
    {
        question: "Minuman yang paling sederhana untuk membantu memenuhi kebutuhan cairan tubuh sehari-hari adalah...",
        options: {
            A: "Air putih",
            B: "Minuman bersoda",
            C: "Minuman tinggi gula",
            D: "Minuman berenergi"
        },
        answer: "A"
    },
    {
        question: "Saat membeli jajanan di sekolah, kebiasaan yang paling baik adalah...",
        options: {
            A: "Memilih hanya berdasarkan warna kemasan",
            B: "Memilih karena sedang populer",
            C: "Memperhatikan kebersihan dan kandungan makanan",
            D: "Memilih makanan dengan harga paling murah"
        },
        answer: "C"
    },
    {
        question: "Manakah yang merupakan contoh makanan sumber protein?",
        options: {
            A: "Nasi, jagung, dan kentang",
            B: "Jeruk, pepaya, dan mangga",
            C: "Telur, ikan, dan tempe",
            D: "Air putih, teh, dan jus"
        },
        answer: "C"
    },
    {
        question: "Mengapa sayur dan buah penting dalam pola makan sehari-hari?",
        options: {
            A: "Karena menyediakan vitamin, mineral, dan serat",
            B: "Karena dapat menggantikan semua jenis makanan",
            C: "Karena hanya berfungsi sebagai penghias makanan",
            D: "Karena semakin banyak selalu lebih baik tanpa batas"
        },
        answer: "A"
    },
    {
        question: "Apa kebiasaan yang tepat dilakukan sebelum makan?",
        options: {
            A: "Langsung makan setelah bermain",
            B: "Mencuci tangan dengan benar",
            C: "Menyentuh semua makanan terlebih dahulu",
            D: "Berbagi alat makan tanpa memperhatikan kebersihan"
        },
        answer: "B"
    },
    {
        question: "Jika seorang siswa terlalu sering minum minuman manis, perubahan kebiasaan yang baik adalah...",
        options: {
            A: "Mengganti dengan minuman manis yang lebih besar",
            B: "Menambahkan gula ke minuman",
            C: "Lebih sering memilih air putih",
            D: "Menggantinya dengan permen"
        },
        answer: "C"
    },
    {
        question: "Mengapa kita dianjurkan mengonsumsi makanan yang beragam?",
        options: {
            A: "Karena semua makanan memiliki zat gizi yang sama",
            B: "Karena tubuh membutuhkan beragam zat gizi",
            C: "Karena makanan sehat harus mahal",
            D: "Karena hanya satu jenis makanan yang diperlukan tubuh"
        },
        answer: "B"
    },
    {
        question: "Sebagai pelajar yang mendukung NGTS, tindakan yang paling tepat adalah...",
        options: {
            A: "Mengajak teman membiasakan pola hidup sehat",
            B: "Menghindari semua makanan selain sayur",
            C: "Memaksa teman mengikuti makanan yang kita sukai",
            D: "Menakut-nakuti teman tentang semua makanan kemasan"
        },
        answer: "A"
    }
];

let currentQuestion = 0;
let correctCount = 0;
let selectedAnswer = null;

function startQuiz() {
    currentQuestion = 0;
    correctCount = 0;
    selectedAnswer = null;

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.add("hidden");
    document.getElementById("quizScreen").classList.remove("hidden");

    showQuestion();
}

function showQuestion() {
    selectedAnswer = null;

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        `Soal ${currentQuestion + 1} dari ${questions.length}`;

    document.getElementById("scoreInfo").textContent =
        `Benar: ${correctCount}`;

    document.getElementById("progressBar").style.width =
        `${((currentQuestion + 1) / questions.length) * 100}%`;

    document.getElementById("questionText").textContent = q.question;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    Object.keys(q.options).forEach(letter => {
        const label = document.createElement("label");
        label.className = "option";

        label.innerHTML = `
            <input type="radio" name="answer" value="${letter}">
            <span class="option-letter">${letter}</span>
            <span>${q.options[letter]}</span>
        `;

        label.addEventListener("click", function() {
            document.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
            label.classList.add("selected");
            selectedAnswer = letter;
            document.getElementById("nextBtn").disabled = false;
        });

        optionsDiv.appendChild(label);
    });

    const nextBtn = document.getElementById("nextBtn");
    nextBtn.textContent =
        currentQuestion === questions.length - 1 ? "Lihat Hasil" : "Berikutnya";
    nextBtn.disabled = true;
}

function nextQuestion() {
    if (!selectedAnswer) return;

    if (selectedAnswer === questions[currentQuestion].answer) {
        correctCount++;
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quizScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.remove("hidden");

    const score = Math.round((correctCount / questions.length) * 100);

    document.getElementById("score").textContent = score;

    let message = "";

    if (score === 100) {
        message = "Luar biasa! Semua jawaban benar. Kamu benar-benar memahami NGTS!";
    } else if (score >= 80) {
        message = "Hebat! Pemahamanmu tentang gizi dan hidup sehat sudah sangat baik.";
    } else if (score >= 60) {
        message = "Bagus! Kamu sudah memahami dasar-dasar NGTS. Tingkatkan lagi pengetahuanmu.";
    } else {
        message = "Tetap semangat! Yuk pelajari lagi tentang gizi dan kebiasaan hidup sehat.";
    }

    document.getElementById("resultMessage").textContent = message;

    document.getElementById("details").innerHTML = `
        <strong>Hasil Kuis</strong><br><br>
        Jawaban benar: <strong>${correctCount} dari ${questions.length}</strong><br>
        Jawaban salah: <strong>${questions.length - correctCount}</strong><br>
        Nilai akhir: <strong>${score}/100</strong>
    `;
}

function restartQuiz() {
    document.getElementById("resultScreen").classList.add("hidden");
    document.getElementById("startScreen").classList.remove("hidden");
}
</script>

</body>
</html>
